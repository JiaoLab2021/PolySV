{% set name = "polysv" %}
{% set version = "1.0.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  entry_points:
    - polysv = polysv:main

requirements:
  build:
    - {{ compiler('cxx') }}
    - make
    - git
    - wget
    - tar
  host:
    - python 3.9
    - pip
    - setuptools
  run:
    - python =3.9
    - samtools =1.18
    - bcftools =1.15 
    - minimap2 =2.28
    - cutesv =2.1.0
    - sniffles =2.2
    - svim =2.0.0
    - svim-asm =1.0.3
    - mummer4 =4.0.0rc1
    - assemblytics =1.2.1
    - jasminesv =1.1.5

channels:
  - bioconda
  - conda-forge
  - defaults

about:
  home: https://github.com/JiaoLab2021/PolySV
  license: MIT
  summary: "A high-quality SV detection, genotyping and optimization pipeline"

extra:
  recipe-maintainers:
    - He Jiabao
